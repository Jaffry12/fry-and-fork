# Publishes the website (the website/ folder) to GitHub Pages on every push to main.
# There is no build step: the folder goes up as it is, except that the share picture gets
# the site's full address, which WhatsApp and Facebook link previews need.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@v6

      # og:image, and the image and logo in the restaurant details (JSON-LD), are relative
      # paths in the source so the site works on any host; here they get the full address.
      - name: Give the share picture its full address
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base="${BASE_URL%/}"
          sed -i \
            -e "s|<meta property=\"og:image\" content=\"images/|<meta property=\"og:image\" content=\"$base/images/|" \
            -e "s|\"image\": \"images/|\"image\": \"$base/images/|" \
            -e "s|\"logo\": \"icon-|\"logo\": \"$base/icon-|" \
            website/index.html website/menu.html
          grep -q "content=\"$base/images/og-image.jpg\"" website/index.html \
            || echo "::warning::og:image in website/index.html was not given the full address; check its markup"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v5
